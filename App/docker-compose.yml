  #  ports:
  #    - "8080:8080"
  #  environment:
  #    ASPNETCORE_ENVIRONMENT: Development
  #    ASPNETCORE_URLS: http://+:8080
  #  networks:
  #    - webapp-network
  #  depends_on:
  #    - mssql
  #    - redis

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=!chOjavacr5swi1r
      - MSSQL_PID=Developer
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - webapp-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P !chOjavacr5swi1r -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: redis-server --requirepass drlbresPewRIpR6! --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - webapp-network

volumes:
  sqlserverdata:
  redis_data:
 
networks:
  webapp-network:
    driver: bridge  
  